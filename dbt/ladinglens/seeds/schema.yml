version: 2

seeds:
  - name: hs_eval_seed
    description: "30 hand-labeled BoL product descriptions with correct HS-6 codes. Used to evaluate HS classifier accuracy in Phase 5. Superseded by hs_eval_seed_v2 -- kept for history, only 12 of 30 rows have a verbatim-matching text anywhere in Bronze (see data/sources.md)."
    columns:
      - name: product_description
        description: "Raw text of the shipment product description as filed with CBP"
        tests: [not_null]
      - name: correct_hs_6
        description: "Hand-assigned HS-6 code. '999999' marks descriptions that are too ambiguous for confident classification."
        tests: [not_null]
      - name: notes
        description: "Reason for ambiguous cases, alternate HS candidates, or classification rationale."

  - name: hs_eval_seed_v2
    description: >
      30 rows sampled directly from silver_bol_shipments_scoped (LLM-classified
      rows only), hand-labeled against USITC HS-6 descriptions. Built to replace
      hs_eval_seed after discovering that seed's product_description values
      don't appear verbatim in Bronze for most rows. product_text is the exact
      raw text as stored in silver_bol_shipments_classified.text -- joins to it
      should use equality, not a fuzzy LIKE match.
    columns:
      - name: product_text
        description: "Raw shipment text, copied verbatim from silver_bol_shipments_scoped.text"
        tests: [not_null]
      - name: classifier_prediction
        description: "hs_code_unified as originally classified, captured at sampling time for reference"
      - name: correct_hs_6
        description: "Hand-assigned HS-6 code. '999999' marks descriptions that are too ambiguous for confident classification."
        tests: [not_null]
      - name: notes
        description: "Reason for ambiguous cases or classification rationale."

  - name: tariff_events
    description: >
      12 hand-curated historical Section 232 (steel/aluminum) and Section 301
      (China) tariff actions, 2018-03-23 through 2025-03-12, cited to USTR.
      Captures the time-varying tariff history that dim_hs_code /
      dim_country's current-regime flags cannot represent on their own (e.g.
      the EU's 2022-2025 Section 232 exemption). Not currently joined into
      fact_shipments's effective_duty_rate_pct calculation, which reflects
      only the current (Q3 2026) regime -- time-conditional exposure against
      this table is deferred to Phase 8's scenario simulator.
    columns:
      - name: event_date
        description: "Effective date of the tariff action."
        tests: [not_null]
      - name: event_type
        description: "'section_232' or 'section_301'."
        tests:
          - not_null
          - accepted_values:
              values: ['section_232', 'section_301']
      - name: hs_scope
        description: "Semicolon-delimited HS-2 chapters affected, or 'VARIOUS'/'ALL' for broad actions."
      - name: country_scope
        description: "Semicolon-delimited country codes affected, or 'ALL'/'ALL_EXCLUDING_SELECTED' for broad actions."
      - name: rate_change_pp
        description: "Rate change in percentage points introduced by this event."
        tests: [not_null]
      - name: description
        description: "Human-readable summary of the action."
      - name: source_url
        description: "Citation (USTR)."
