
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'ladinglens'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'ladinglens'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
#
# Medallion layout: bronze (raw, typed) -> silver (cleaned/entity-resolved) -> gold (star schema).
models:
  ladinglens:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

# correct_hs_6 must stay varchar -- CSV type inference would otherwise cast
# it to a number, silently dropping a leading zero on any future HS-6 code
# in chapters 01-09 (none of the current 30 rows have one, but real ones do).
seeds:
  ladinglens:
    hs_eval_seed:
      +column_types:
        product_description: varchar
        correct_hs_6: varchar
        notes: varchar
    hs_eval_seed_v2:
      +column_types:
        product_text: varchar
        classifier_prediction: varchar
        hs_source_final: varchar
        predicted_chapter: varchar
        correct_hs_6: varchar
        notes: varchar
    tariff_events:
      +column_types:
        event_date: date
        event_type: varchar
        hs_scope: varchar
        country_scope: varchar
        rate_change_pp: float
        description: varchar
        source_url: varchar
